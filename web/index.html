<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell use the whole screen (safe areas are padded in CSS). Page zoom stays available for people
         who need it: pinches on the map zoom the map (MapLibre), and double-tap zoom is off (touch-action in styles.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Road closures and official HGV diversions on England's motorways and major A roads." />
    <meta name="theme-color" content="#15191d" />
    <title>Traffic Advanced</title>
    <!-- Rendered from the brand masters in web/brand (README there). Browsers that support SVG favicons use favicon.svg; the PNGs
         are fallbacks. The touch icon is full bleed, as iOS rounds the corners itself. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved or system theme before first paint (no flash of the wrong theme).
      try {
        var saved = localStorage.getItem("ta-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <!-- Splash: painted with the first frame (styled by the bundled stylesheet, no inline CSS), so the map and data never assemble in
         view. The app removes it as soon as the closures and the first map render are ready (web/src/splash.ts). -->
    <div id="splash" class="ta-splash" role="status">
      <div class="ta-splash-inner">
        <img class="ta-splash-banner" src="/banner.svg" width="1186" height="400" alt="Traffic Advanced" fetchpriority="high" />
        <div class="ta-splash-progress" aria-hidden="true"></div>
        <p class="ta-splash-text">Loading closures and map</p>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
