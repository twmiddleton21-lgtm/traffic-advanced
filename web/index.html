<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Road closures and official HGV diversions on England's motorways and major A roads." />
    <meta name="theme-color" content="#15191d" />
    <title>Traffic Advanced</title>
    <script>
      // Apply the saved or system theme before first paint (no flash of the wrong theme).
      try {
        var saved = localStorage.getItem("ta-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
