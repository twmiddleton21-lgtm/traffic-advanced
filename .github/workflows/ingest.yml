# Live ingestion runner (docs/INGESTION.md): National Highways capture → pin → FROZEN matcher → publish → upload to R2.
# The Cloudflare Worker stays a read-only API/static host; this job is the only writer of the snapshot bucket.
#
# Scheduled every 15 minutes (owner-approved 2026-10-06): each scheduled run captures, publishes and uploads to R2 through every
# safeguard; a failed run never replaces the snapshot being served. Manual runs (Actions → Ingest → Run workflow) default to a
# dry run that uploads nothing; "remote" uploads.
name: Ingest

on:
  workflow_dispatch:
    inputs:
      target:
        description: "dry-run: capture and publish inside the runner only; remote: also upload to the real R2 bucket"
        type: choice
        options: [dry-run, remote]
        default: dry-run
  # Every 15 minutes, offset from the top of the hour (when GitHub delays scheduled runs most). The concurrency group below
  # prevents overlapping runs. Free for public repositories on standard runners.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

# One ingestion at a time, so two runs can never race to switch the current pointer.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets live in this GitHub environment, which can require a reviewer before a run gets them.
    environment: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the frozen matcher before touching any data
        run: npx vitest run shared/diversion/rules-freeze.test.ts
      # Exactly one of the next two steps runs. Only scheduled runs and the explicit "remote" choice get the R2 credentials;
      # every other manual run publishes inside the runner only and never sees them (and never touches R2).
      - name: Ingest once (no upload)
        if: ${{ github.event_name != 'schedule' && inputs.target != 'remote' }}
        env:
          TARGET: ${{ inputs.target }}
          NH_API_KEY: ${{ secrets.NH_API_KEY }}
        run: npm run ingest:once -- --no-upload
      - name: Ingest once and publish to R2
        if: ${{ github.event_name == 'schedule' || inputs.target == 'remote' }}
        env:
          NH_API_KEY: ${{ secrets.NH_API_KEY }}
          # Bucket-scoped R2 API token (Object Read & Write on traffic-advanced-snapshots), used through R2's S3 API.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run ingest:once -- --remote
      - name: Keep the refresh log and provenance (no raw data, no secrets)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingest-${{ github.run_id }}
          path: |
            data/published/meta.json
            data/published/current.json
            data/published/snapshots/*/provenance.json
          if-no-files-found: warn
          retention-days: 90
